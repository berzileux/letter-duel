# Main nginx configuration for the Letter Duel static site.
# Runs as a non-root user (nginxinc/nginx-unprivileged), so every writable path is under /tmp.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logs go to stdout and stderr so Cloud Logging picks them up.
    access_log /dev/stdout;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # The word list is 1.7 MB of plain text and the meanings are JSON, so compression matters.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080 default_server;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

	    # test https
	    location /.well-known/acme-challenge/ {
	        root /usr/share/nginx/html;
	        default_type "text/plain";
	    }


        # Static site: only GET, HEAD and OPTIONS make sense.
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
            return 405;
        }

        # Security headers. Do not add add_header inside the location blocks below:
        # nginx drops these server-level headers in any block that sets its own add_header.
        # The CSP allows only this origin plus Google Fonts (stylesheet and font files).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Liveness and readiness probe target.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Hashed build output never changes for a given filename.
        location /assets/ {
            expires 1y;
            try_files $uri =404;
        }

        # The shell page must always be revalidated so a new deploy is picked up.
        location = /index.html {
            expires -1;
        }

        # Dictionary and meanings: static data, refreshed at most once a day.
        location = /enable1.txt {
            expires 1d;
            try_files $uri =404;
        }
        location /defs/ {
            expires 1d;
            try_files $uri =404;
        }
        location = /wordnet-license.txt {
            expires 1d;
            default_type text/plain;
            try_files $uri =404;
        }

        # Single page with no client-side routes, so unknown paths are real 404s.
        # This also keeps a missing data file from returning index.html as if it were JSON.
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
